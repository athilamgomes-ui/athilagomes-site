<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:'Nunito';font-weight:400 800;font-display:block;
  src:url('../fonts/nunito-latin.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#080e1c;color:#e9eff8;
  position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:100px;}
.glow{position:absolute;inset:0;background:
  radial-gradient(105% 70% at 78% 30%, rgba(53,99,255,.38) 0%, rgba(8,14,28,0) 62%);}
.ct{position:relative;z-index:2;padding-bottom:200px}
.marca{font-size:26px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  color:#7ea2ff;margin-bottom:26px}
h1{font-size:104px;font-weight:800;line-height:1.0;letter-spacing:-3px;color:#fff}
h1 em{font-style:normal;color:#7ea2ff}
.sub{font-size:34px;color:#a9bdd6;line-height:1.4;margin-top:26px;font-weight:600}
.barra{border-left:7px solid #3563ff;padding-left:30px;margin:40px 0}
.barra p{font-size:38px;line-height:1.35;color:#dce6f5;font-weight:700}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px}
.chip{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);
  border-radius:16px;padding:18px 24pxpx;font-size:25px;font-weight:700;color:#fff;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{background:#3563ff;color:#fff;font-size:36px;font-weight:800;border-radius:20px;
  padding:30pxpx;text-align:center;margin-top:54px;
  box-shadow:0 18px 50px rgba(53,99,255,.4)}
.rodape{position:absolute;left:100px;right:100px;bottom:100px;z-index:2;
  display:flex;align-items:center;gap:24px}
.rodape img{width:104px;height:104px;border-radius:20px;object-fit:cover;
  object-position:50% 15%}
.rodape b{display:block;font-size:34px;color:#fff;font-weight:800}
.rodape span{font-size:25px;color:#8fa3bd;font-weight:600}
.lista{margin-top:34px}
.lista div{font-size:36px;font-weight:700;color:#dce6f5;padding:22px 0;
  border-bottom:2px solid rgba(255,255,255,.10);display:flex;gap:20px}
.lista div:last-child{border-bottom:0}
.lista i{font-style:normal;color:#3563ff;font-weight:800}
.ct{padding-bottom:0}
.rodape{bottom:300px}
body{justify-content:center;padding-top:300px;padding-bottom:420px}
</style></head><body><div class="glow"></div><div class="ct">
  <div class="marca">Imersão presencial · Altamira</div>
  <h1>Investindo<br>com <em>Sabedoria</em></h1>
  <div class="barra"><p>Um sábado. Seis horas.<br>Você sai com a sua primeira
    carteira de investimentos montada.</p></div>
  <div class="chips">
    <div class="chip">📅 sáb, 17 de outubro</div>
    <div class="chip">🕓 16h às 22h</div>
    <div class="chip">📍 Vineyard Central</div>
    <div class="chip">👥 50 vagas</div>
  </div>
</div><div class="rodape"><img src="../img/athila-retrato.jpg" alt="">
  <div><b>Áthila Gomes</b><span>Pastor, empresário e investidor</span></div></div></body></html>
